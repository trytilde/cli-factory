type: object
required:
  - time_min
  - time_max
properties:
  time_min:
    type: string
    format: date-time
  time_max:
    type: string
    format: date-time
  query:
    type: string
  max_results:
    type: integer
    minimum: 1
    maximum: 50
    default: 10
  single_events:
    type: boolean
    default: true
