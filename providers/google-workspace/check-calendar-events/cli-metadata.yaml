id: check-calendar-events
name: Check Calendar Events
short_description: List Google Calendar events in a time window.
long_description: |
  Lists events from a Google Calendar with optional time bounds, text query,
  attendee expansion, ordering, and single-event expansion for recurring events.
categories:
  - calendar
  - scheduling
aliases:
  - list calendar
  - check schedule
  - upcoming events
command_path:
  - google-workspace
  - check-calendar-events
