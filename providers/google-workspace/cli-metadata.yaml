id: google-workspace
name: Google Workspace
short_description: Send Gmail messages and manage Google Calendar events.
long_description: |
  Google Workspace provides curated Gmail and Google Calendar tools for common
  agent workflows: sending email, checking recent or matching email, creating
  calendar events, and checking upcoming calendar events.
categories:
  - communication
  - calendar
  - email
  - productivity
aliases:
  - google
  - gmail
  - google calendar
  - workspace
provider_parameters:
  - name: bearer_token
    description: OAuth 2.0 access token with the Gmail or Calendar scopes required by the selected tool.
  - name: gmail_base_url
    description: Optional Gmail API base URL. Defaults to https://gmail.googleapis.com.
  - name: calendar_base_url
    description: Optional Calendar API base URL. Defaults to https://www.googleapis.com.
