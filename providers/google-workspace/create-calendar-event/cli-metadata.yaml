id: create-calendar-event
name: Create Calendar Event
short_description: Create an event on a Google Calendar.
long_description: |
  Creates a Google Calendar event with summary, start and end times, optional
  attendees, location, description, timezone, and Google Meet conference data.
  A dry-run mode validates and returns the event payload without writing.
categories:
  - calendar
  - scheduling
aliases:
  - schedule meeting
  - create google calendar event
  - add calendar event
command_path:
  - google-workspace
  - create-calendar-event
