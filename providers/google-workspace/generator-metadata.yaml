  - https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/list
  - https://developers.google.com/workspace/calendar/api/v3/reference/events/insert
  - https://developers.google.com/calendar/api/v3/reference/events/list
openapi_urls: []
graphql_urls: []
oss_repositories: []
example_urls:
  - https://developers.google.com/workspace/gmail/api/guides/sending
  - https://developers.google.com/workspace/gmail/api/guides/list-messages
notes:
  - Uses direct Google REST APIs with caller-supplied OAuth bearer tokens.
  - Gmail send requires gmail.send, gmail.compose, gmail.modify, or mail.google.com scope.
  - Gmail checking requires gmail.readonly, gmail.metadata, gmail.modify, or mail.google.com scope.
  - Calendar event creation requires a writable Calendar events scope such as calendar.events.
  - Calendar event checking can use read-only Calendar scopes.
