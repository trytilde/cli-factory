id: check-emails
name: Check Emails
short_description: Search recent Gmail messages and return readable summaries.
long_description: |
  Lists Gmail messages matching an optional Gmail search query and fetches
  metadata for each result so agents can inspect sender, recipients, subject,
  date, snippet, message id, and thread id.
categories:
  - email
  - communication
aliases:
  - search gmail
  - read inbox
  - check mail
command_path:
  - google-workspace
  - check-emails
